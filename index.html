<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiCartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--nv:#0b1426;--nv2:#12203d;--gold:#d4af37;--gold2:#f3d98b;--tx:#e8ecf5;--mu:#8d9ab5;--bd:rgba(212,175,55,.25);--hf:Cinzel,Georgia,serif;--bf:Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:var(--bf);min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#16295a 0%,transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--gold2)}
h1,h2{font-family:var(--hf);letter-spacing:.5px;margin:.4em 0}
h2{color:var(--gold2);font-size:20px;margin-top:28px}
.top{position:sticky;top:0;z-index:5;background:rgba(5,9,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:var(--hf);font-weight:800;font-size:20px;color:var(--gold);text-decoration:none;white-space:nowrap}
.side{display:flex;gap:8px;align-items:center}
.chip{background:var(--nv2);border:1px solid var(--bd);padding:6px 10px;border-radius:20px;font-size:13px;color:var(--gold2)}
select,input{font:inherit;font-size:14px;background:var(--nv);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
input{flex:1;min-width:160px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.btn{font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;background:var(--nv2);color:var(--tx);border:1px solid var(--bd);padding:10px 18px;border-radius:12px;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font-weight:700;border:0;box-shadow:0 6px 20px -6px var(--gold)}
.btn.big{font-size:18px;padding:15px 38px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.mu{color:var(--mu)}.sm{font-size:12px}.c{text-align:center;margin:18px 0}.err{color:#ff7b7b}
.hero{padding:36px 24px;border-radius:20px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--nv2),var(--nv));box-shadow:0 20px 50px -20px #000}
.hero h1{font-size:34px;color:var(--gold2);margin:0}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--nv);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:22px}.stat b{font-size:22px;color:var(--gold2)}.stat small{color:var(--mu)}
.dist div{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.dist i{display:block;height:8px;border-radius:6px;min-width:3px}
.packv{text-align:center;padding:24px 0}
.stack{font-size:96px;filter:drop-shadow(0 10px 24px var(--gold));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.count{font-family:var(--hf);font-size:42px;color:var(--gold2)}
.bar{height:8px;background:var(--nv2);border-radius:6px;max-width:340px;margin:12px auto;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .5s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--nv2),var(--nv));border:2px solid var(--rc);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 24px -10px #000,0 0 16px -6px var(--rc);position:relative;height:100%;min-height:320px;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.art{height:135px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,var(--rc),var(--bg));overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.hd{padding:9px 11px 0}.nm{display:block;font-size:15px}.yr{font-size:11px;color:var(--mu)}
.ds{padding:5px 11px;font-size:12px;line-height:1.4;color:#b3bdd3;flex:1;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rr{padding:6px 11px;font:700 11px var(--bf);text-transform:uppercase;letter-spacing:1px;background:var(--rc);color:#fff;display:flex;justify-content:space-between}
.card.god{animation:gl 2s infinite alternate}
@keyframes gl{to{box-shadow:0 0 30px 2px var(--rc)}}
.card.lock{--rc:#56627c;opacity:.6;cursor:default}.card.lock .art img{filter:grayscale(1) brightness(.6)}
.new{position:absolute;top:8px;right:8px;background:#e03131;color:#fff;font:700 10px var(--bf);padding:3px 7px;border-radius:6px;z-index:2}.new.dup{background:var(--gold);color:#1a1405}
.row2{display:flex;gap:12px;background:var(--nv);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.th{width:84px;height:84px;flex:none;border-radius:10px;background:var(--nv2);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.bd p{margin:4px 0 8px;color:#b3bdd3;font-size:13px}
.tag{font-size:11px;background:var(--nv2);border:1px solid var(--bd);padding:2px 8px;border-radius:10px}.tag.ok{background:#17502f;border-color:#2f9e60}
.ph{text-align:center;padding:60px 20px;border:1px dashed var(--bd);border-radius:20px}.ph span{font-size:60px}
#ov,#md{position:fixed;inset:0;background:rgba(2,4,10,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;overflow:auto}
#ov{z-index:20}#md{z-index:30}#ov.show,#md.show{display:flex}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.flip{width:185px;height:330px;perspective:900px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.open>div{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden}
.f{transform:rotateY(180deg)}.f .card{min-height:0;cursor:pointer}
.b{background:linear-gradient(135deg,#0b1d4d,#000);border-radius:16px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 0 24px -6px var(--gold)}
.dcard{max-width:560px;width:100%;background:var(--nv);border:2px solid var(--rc);border-radius:18px;overflow:hidden;position:relative}
.dcard>img{width:100%;max-height:280px;object-fit:cover}.dbody{padding:16px}.dbody h2{margin:8px 0}
.chip2{display:inline-block;margin:2px;font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:3px 8px;text-decoration:none}
.x{position:absolute;top:8px;right:8px;z-index:3}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--nv2);border:1px solid var(--gold);color:var(--tx);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 16px 30px}
.top .side{margin-left:auto}
.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:linear-gradient(135deg,#3b5bdb,#8b5cf6);color:#fff;font:700 16px var(--bf);cursor:pointer;padding:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;background:rgba(5,9,20,.96);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mu);font:500 11px var(--bf);text-decoration:none;padding:6px 2px;border-radius:12px;cursor:pointer;position:relative}
.bnav span{font-size:20px;padding:2px 14px;border-radius:12px}
.bnav .on{color:var(--gold2)}.bnav .on span{background:var(--nv2)}
.bnav .ctr span{width:58px;height:58px;margin-top:-28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 18px -4px var(--gold);border:3px solid var(--bg);padding:0}
.bnav .bd2{position:absolute;top:-30px;left:calc(50% + 12px);background:#3b5bdb;color:#fff;font:700 11px var(--bf);min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.seg{display:flex;gap:4px;background:var(--nv);border:1px solid var(--bd);border-radius:16px;padding:5px;margin-bottom:16px}
.seg button{flex:1;font:inherit;font-size:14px;background:none;border:0;color:var(--mu);padding:12px 6px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--nv2);color:var(--tx);font-weight:700}
.packv .btns{justify-content:center}.count small{font-size:20px;color:var(--mu)}
.sheet{width:100%;max-width:560px;background:var(--nv);border:1px solid var(--bd);border-radius:22px;padding:20px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.sgrid .btn{padding:14px 4px;font-size:12px}
#ov{justify-content:flex-start}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
.res{width:100%;max-width:1000px}
footer{padding-bottom:120px}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#jugar">📖 WikiCartas</a><div class="side"><span class="chip" id="chip"></span><select id="lg" title="Idioma de Wikipedia"></select><button class="av" id="av" data-a="avatar">C</button></div></header>
<main id="app"></main>
<nav class="bnav" id="nav"></nav>
<div id="ov"><div id="ld"></div><div class="row" id="row"></div><div class="row" id="ovb"><button class="btn" id="all">Revelar todas</button><button class="btn gold" id="cl">Cerrar</button></div></div>
<div id="md"><div id="mb"></div><button class="btn" id="mc">Cerrar</button></div>
<div id="toast"></div>
<input type="file" id="pf" accept="application/json" hidden>
<footer>Textos de <a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> bajo CC BY-SA 4.0. Datos de <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>. Cada imagen conserva su propia licencia, indicada en el detalle de la carta.</footer>
<script>
const LANGS={es:"Español",en:"English",ca:"Català"}; // añade más códigos de Wikipedia aquí
const RAR=[["Común","#8a93a6"],["Rara","#3fae6a"],["Super rara","#3b8ee8"],["Ultra rara","#8b5cf6"],["Mítica","#ec4899"],["Legendaria","#f59e0b"],["God","#ef4444"]];
const TH=[8,20,45,80,130,200]; // nº de idiomas del artículo para subir de rareza
const YP=["P571","P569","P577","P575","P580","P585","P574","P1319"];
const CATS={Q5:"Personas",Q6256:"Lugares",Q515:"Lugares",Q486972:"Lugares",Q532:"Lugares",Q41176:"Lugares",Q16521:"Naturaleza",Q7432:"Naturaleza",Q11424:"Cultura",Q7725634:"Cultura",Q482994:"Cultura",Q134556:"Cultura",Q3305213:"Cultura",Q7889:"Cultura",Q5398426:"Cultura",Q4830453:"Organizaciones",Q783794:"Organizaciones",Q43229:"Organizaciones",Q12136:"Ciencia",Q11344:"Ciencia",Q11173:"Ciencia",Q634:"Ciencia",Q523:"Ciencia",Q318:"Ciencia"};
const CL=["Personas","Lugares","Naturaleza","Cultura","Organizaciones","Ciencia","Otros"];
const NV=[["tienda","🛍️","Tienda"],["coleccion","🗂️","Colección"],["jugar","🎴","Jugar"],["mercado","🏪","Mercado"]];
const TAB={jugar:"sobres",coleccion:"cartas",mercado:"subastas"};
const SUB={jugar:[["sobres","Sobres"],["juegos","Combate"],["eventos","Eventos"]],coleccion:[["cartas","Mis cartas"],["enciclopedia","Enciclopedia"],["perfil","Mi perfil"]],mercado:[["subastas","Subastas"],["intercambios","Intercambios"],["anuncios","Mis anuncios"]]};
const OLD={inicio:["jugar"],sobres:["jugar","sobres"],combate:["jugar","juegos"],enciclopedia:["coleccion","enciclopedia"],perfil:["coleccion","perfil"]};
let cur="jugar";
const K2="wikicartas_v2",K1="wikicartas_live_v1",MAX=50,MS=3e5;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cut=(s,n)=>s&&s.length>n?s.slice(0,n-1)+"…":(s||"");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rar=n=>{let r=0;while(r<6&&n>=TH[r])r++;return r};
function fy(y){if(y==null)return "Año desconocido";if(y<=-1e6){const a=-y;return "Hace "+(a>=1e9?(a/1e9).toFixed(1).replace(".",",")+" mil millones":Math.round(a/1e6)+" millones")+" de años"}return y<0?(-y)+" a. C.":y+" d. C."}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),4000)}
/* ---------- Guardado (con migración desde la v1, que no se borra) ---------- */
function load(){
 try{const s=JSON.parse(localStorage.getItem(K2));if(s&&s.own){s.seen=s.seen||{};return s}}catch(e){}
 const n={ver:2,p:MAX,t:Date.now(),own:{},seen:{},lang:"es",name:"Coleccionista"};
 try{const o=JSON.parse(localStorage.getItem(K1));if(o&&o.own){n.p=o.p;n.t=o.t;for(const t in o.own){const c=o.own[t];n.own["p:es:"+t]={id:"p:es:"+t,q:null,cat:"Otros",n:c.n,y:c.y,cnt:c.c,ts:c.ts,v:{es:{t:c.t,d:c.d,x:c.x,u:c.u,i:c.i,lic:null}}}}}}catch(e){}
 return n}
let S=load();
function save(){try{localStorage.setItem(K2,JSON.stringify(S))}catch(e){toast("No se pudo guardar en este navegador")}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function tick(){const b=S.p+"|"+S.t,now=Date.now();
 if(S.p>=MAX){S.p=MAX;S.t=now}else{const g=Math.floor((now-S.t)/MS);if(g>0){S.p=Math.min(MAX,S.p+g);S.t=S.p>=MAX?now:S.t+g*MS}}
 return b!==S.p+"|"+S.t}
/* ---------- APIs de Wikimedia ---------- */
async function jf(u){for(let a=0;a<2;a++){const r=await fetch(u,{signal:AbortSignal.timeout(12000)});if(r.status===429||r.status===503){await sleep(1500);continue}if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}throw new Error("limit")}
const errMsg=e=>{const m=String(e.message);return m==="limit"?"Wikipedia está limitando las peticiones. Espera un par de minutos.":/Failed to fetch|NetworkError|Load failed/.test(m)?"Wikipedia no respondió: puede ser el límite de peticiones para navegadores, un bloqueador o falta de conexión. Espera un par de minutos.":"No se pudo obtener cartas ("+m.replace("fail:","").trim()+")."};
const TP={};
async function topList(L){if(TP[L])return TP[L];const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const k="wc_top_"+L+"_"+d.getFullYear()+"_"+(d.getMonth()+1);
 try{const c=JSON.parse(localStorage.getItem(k));if(c&&c.length)return TP[L]=c}catch(e){}
 try{const j=await jf("https://wikimedia.org/api/rest_v1/metrics/pageviews/top/"+L+".wikipedia/all-access/"+d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/all-days");
  TP[L]=j.items[0].articles.map(a=>a.article).filter(t=>t.indexOf(":")<0&&!/^(Portada|Main_Page|Pàgina_principal)/.test(t)).slice(0,1000);
  try{localStorage.setItem(k,JSON.stringify(TP[L]))}catch(e){}
 }catch(e){console.warn("Lista popular:",e);TP[L]=[]}
 return TP[L]}
function info(e){if(!e||(!e.claims&&!e.sitelinks))return{y:null,n:1,c:"Otros"};const cl=e.claims||{};let y=null,c="Otros";
 for(const p of YP){try{const m=/^([+-])(\d+)/.exec(cl[p][0].mainsnak.datavalue.value.time);if(m){const v=(m[1]==="-"?-1:1)*+m[2];if(v){y=v;break}}}catch(_){}}
 for(const s of cl.P31||[]){try{const k=CATS[s.mainsnak.datavalue.value.id];if(k){c=k;break}}catch(_){}}
 return{y,n:Object.keys(e.sitelinks||{}).length||1,c}}
async function lic(v,L){ // licencia y autoría reales de la imagen; se consulta al abrir el detalle de la carta
 if(!v.i)return null;
 try{const f=v.f||decodeURIComponent(v.i.includes("/thumb/")?v.i.split("/thumb/")[1].split("/")[2]:v.i.split("/").pop());
  const h=v.i.includes("/wikipedia/commons/")?"commons.wikimedia.org":L+".wikipedia.org";
  const j=await jf("https://"+h+"/w/api.php?action=query&titles="+encodeURIComponent("File:"+f)+"&prop=imageinfo&iiprop=extmetadata&format=json&origin=*");
  const m=Object.values(j.query.pages)[0].imageinfo[0].extmetadata,g=k=>m[k]&&m[k].value?m[k].value:"";
  const art=new DOMParser().parseFromString(g("Artist"),"text/html").body.textContent.trim();
  return{f:f.replace(/_/g," "),name:g("LicenseShortName"),url:g("LicenseUrl"),artist:art,page:"https://"+h+"/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"))}
 }catch(e){return null}}
// Un sobre = 3 consultas como máximo (artículos populares, aleatorios y Wikidata en lote)
const QS="&prop=pageprops|pageimages|extracts|description|info&ppprop=wikibase_item|disambiguation&piprop=thumbnail|name&pithumbsize=320&exintro=1&explaintext=1&exsentences=3&exlimit=max&inprop=url&format=json&origin=*";
async function pages(L,sel){const j=await jf("https://"+L+".wikipedia.org/w/api.php?action=query&redirects=1"+sel+QS);
 return Object.values((j.query&&j.query.pages)||{}).filter(p=>p.extract&&p.fullurl&&p.pageprops&&p.pageprops.wikibase_item&&!("disambiguation" in p.pageprops))}
async function drawCards(L,n){const pool=await topList(L),got=[],seen=new Set(),dec=t=>{try{return decodeURIComponent(t)}catch(e){return t}};
 for(let r=0;r<Math.ceil(n/5)+5&&got.length<n;r++){const need=Math.min(20,n-got.length),nt=pool.length?Math.round(need*.35):0,tit=[];
  while(tit.length<nt)tit.push(pool[Math.random()*pool.length|0]);
  const [a,b]=await Promise.all([nt?pages(L,"&titles="+encodeURIComponent(tit.map(dec).join("|"))):[],need-nt?pages(L,"&generator=random&grnnamespace=0&grnlimit="+Math.min(20,need-nt+3)):[]]);
  for(const p of [...a,...b]){const q=p.pageprops.wikibase_item;if(!seen.has(q)&&got.length<n){seen.add(q);got.push(p)}}
  if(got.length<n)await sleep(200)}
 if(got.length<n)throw new Error("fail: no se obtuvieron suficientes artículos");
 const ents={};
 for(let i=0;i<got.length;i+=20){try{Object.assign(ents,(await jf("https://www.wikidata.org/w/api.php?action=wbgetentities&ids="+got.slice(i,i+20).map(p=>p.pageprops.wikibase_item).join("|")+"&props=claims|sitelinks&format=json&origin=*")).entities||{})}catch(e){if(e.message==="limit")throw e;console.warn("Wikidata:",e)}}
 return got.map(p=>{const q=p.pageprops.wikibase_item,w=info(ents[q]);return{id:q,q,cat:w.c,n:w.n,y:w.y,cnt:1,ts:Date.now(),v:{[L]:{t:p.title,d:p.description||"",x:p.extract,u:p.fullurl,i:p.thumbnail?p.thumbnail.source:"",f:p.pageimage||"",lic:null}}}})}
// Una carta = un concepto (QID). Otros idiomas del mismo QID se añaden como versión, no como carta nueva.
function add(c){const L=Object.keys(c.v)[0],lg="p:"+L+":"+c.v[L].t;
 if(c.q&&S.own[lg]&&!S.own[c.id]){const o=S.own[lg];delete S.own[lg];Object.assign(o,{id:c.id,q:c.q,cat:c.cat,y:c.y,n:c.n});S.own[c.id]=o}
 const o=S.own[c.id];delete S.seen[c.id];
 if(!o){S.own[c.id]=c;return true}
 o.cnt++;o.ts=c.ts;o.n=Math.max(o.n,c.n);
 if(!o.v[L])o.v[L]=c.v[L];else if(!o.v[L].lic&&c.v[L].lic)o.v[L].lic=c.v[L].lic;
 return false}
/* ---------- Cartas ---------- */
function ver(c,L){const l=c.v[L]?L:c.v[S.lang]?S.lang:Object.keys(c.v)[0];return[l,c.v[l]]}
const img=u=>`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
function cardH(c,o){o=o||{};const r=rar(c.n),rc=RAR[r],[l,v]=ver(c,o.l||S.lang);
 return `<div class="card${r===6?" god":""}" style="--rc:${rc[1]}" data-a="det" data-id="${esc(c.id)}">${o.x||""}<div class="art">${v.i?img(v.i):"📖"}</div><div class="hd"><b class="nm">${esc(v.t)}</b><span class="yr">${fy(c.y)} · ${c.cat}</span></div><div class="ds">${esc(cut(v.x,200))}</div><div class="rr"><span>${rc[0]}</span><span>${l.toUpperCase()} · 🌐${c.n}</span></div></div>`}
const lockH=s=>`<div class="card lock"><div class="art">${s.i?img(s.i):"❓"}</div><div class="hd"><b class="nm">${esc(s.t)}</b><span class="yr">Pendiente · ${s.L.toUpperCase()}</span></div><div class="ds">Marcada desde la enciclopedia. Aún no la has obtenido en un sobre.</div><div class="rr"><span>Sin obtener</span><span>—</span></div></div>`;
const LT=new Map();let shown="";
function det(id){const c=S.own[id];if(!c)return;const rc=RAR[rar(c.n)],[l,v]=ver(c,S.lang),li=v.lic,a=t=>`target="_blank" rel="noopener"`;
 const im=li?`Imagen: <a href="${esc(li.page)}" ${a()}>${esc(li.f)}</a>${li.artist?" · "+esc(li.artist):""} · ${li.name?(li.url?`<a href="${esc(li.url)}" ${a()}>${esc(li.name)}</a>`:esc(li.name)):"licencia no indicada"}`:v.i?(LT.get(id+l)===2?"Imagen: licencia no disponible; consulta la página de la imagen en Wikipedia.":"Imagen: comprobando licencia…"):"Sin imagen.";
 $("mb").innerHTML=`<div class="dcard" style="--rc:${rc[1]}">${v.i?img(v.i):""}<div class="dbody"><span class="tag" style="background:${rc[1]};color:#fff">${rc[0]}</span><h2>${esc(v.t)}</h2><p class="mu">${esc(v.d)}</p><p>${esc(v.x)}</p><p class="mu sm">${fy(c.y)} · ${c.cat} · ${c.n} idiomas · ×${c.cnt}</p><p>${Object.keys(c.v).map(k=>`<a class="chip2" href="${esc(c.v[k].u)}" ${a()}>${k.toUpperCase()}: ${esc(c.v[k].t)} ↗</a>`).join("")}</p><p class="mu sm">${c.q?`Wikidata: <a href="https://www.wikidata.org/wiki/${c.q}" ${a()}>${c.q}</a>`:"Sin identificador de Wikidata (carta antigua)."}</p><p class="mu sm">Texto: Wikipedia, <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" ${a()}>CC BY-SA 4.0</a>.<br>${im}</p></div></div>`;
 $("md").classList.add("show");shown=id;const key=id+l;
 if(v.i&&!v.lic&&!LT.has(key)){LT.set(key,1);lic(v,l).then(li=>{if(li){v.lic=li;save()}else LT.set(key,2);if(shown===id&&$("md").classList.contains("show"))det(id)})}}
const SOC=[["🌐","Chat global"],["💬","Mensajes"],["👥","Amigos"],["🛡️","Mi gremio"],["🔨","Subasta en directo"],["👑","Hall of fame"],["🏆","Clasificación"],["▦","Mi código QR"],["📷","Escanear QR"]];
function social(){shown="";$("mb").innerHTML=`<div class="sheet"><h2 style="margin-top:0">Social</h2><p class="mu sm">Todo esto necesita servidor y cuentas de jugador. Todavía no está disponible.</p><div class="sgrid">${SOC.map(s=>`<button class="btn" data-a="soon" data-t="${s[1]}"><div style="font-size:26px">${s[0]}</div>${s[1]}</button>`).join("")}</div></div>`;$("md").classList.add("show")}
/* ---------- Sobres ---------- */
let busy=false;
let coolUntil=0;
async function openPack(k){tick();if(S.p<1||busy)return;
 if(Date.now()<coolUntil){toast("Espera "+Math.ceil((coolUntil-Date.now())/1000)+" s antes de reintentar (límite de peticiones de Wikipedia).");return}
 const np=Math.min(k===0?S.p:(k||1),S.p),L=S.lang;busy=true;ui();
 $("row").innerHTML="";$("ld").textContent="Abriendo "+np+(np>1?" sobres… puede tardar unos segundos":" sobre…");$("ld").style.display="block";$("ovb").style.display="none";$("ov").classList.add("show");
 try{const cs=await drawCards(L,np*5);
  if(S.p>=MAX)S.t=Date.now();S.p-=np;
  const rs=cs.map(c=>{const nw=add(c);return[S.own[c.id],nw]});
  save();$("ld").style.display="none";$("ovb").style.display="flex";$("all").style.display=np===1?"":"none";
  const bd=([o,nw])=>nw?'<span class="new">NUEVA</span>':'<span class="new dup">×'+o.cnt+'</span>';
  if(np===1){$("row").innerHTML=rs.map(r=>`<div class="flip"><div><div class="b">🎴</div><div class="f">${cardH(r[0],{x:bd(r)})}</div></div></div>`).join("");
   document.querySelectorAll("#row .flip").forEach(f=>f.onclick=()=>f.classList.add("open"))}
  else{const nn=rs.filter(r=>r[1]).length,cnt=RAR.map((r,i)=>[r,rs.filter(x=>rar(x[0].n)===i).length]).filter(x=>x[1]);
   rs.sort((a,b)=>rar(b[0].n)-rar(a[0].n)||b[1]-a[1]);
   $("row").innerHTML=`<div class="res"><h2 style="text-align:center">${np} sobres · ${rs.length} cartas</h2><p class="c mu">${nn} nuevas · ${rs.length-nn} repetidas</p><p class="c">${cnt.map(x=>`<span class="tag" style="border-color:${x[0][1]}">${x[0][0]}: ${x[1]}</span>`).join(" ")}</p><div class="grid">${rs.map(r=>cardH(r[0],{x:bd(r)})).join("")}</div></div>`}
 }catch(e){console.error("Abrir sobre:",e);if(!/^fail/.test(e.message))coolUntil=Date.now()+45000;$("ov").classList.remove("show");toast(errMsg(e)+" No se ha gastado ningún sobre.")}
 busy=false;ui()}
function ui(){if(tick())save();$("chip").textContent="🎴 "+S.p+"/"+MAX+" · 🗂️ "+Object.keys(S.own).length;const pb=$("pb");if(pb)pb.textContent=S.p;$("av").textContent=((S.name||"C")[0]||"C").toUpperCase();const n=$("n");if(!n)return;
 n.textContent=S.p;$("bf").style.width=S.p/MAX*100+"%";$("open").disabled=S.p<1||busy;$("open10").disabled=S.p<10||busy;$("openall").disabled=S.p<2||busy;$("na").textContent=S.p;
 const s=Math.max(0,Math.ceil((S.t+MS-Date.now())/1000));
 $("nx").textContent=S.p>=MAX?"¡Sobres al máximo!":"Próximo sobre en "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
/* ---------- Vistas ---------- */
const V={},A={},CO={},JG={},AC={};
const st=(i,v,l)=>`<div class="stat"><span>${i}</span><b>${v}</b><small>${l}</small></div>`;
const ph=(i,t,x)=>`<div class="ph"><span>${i}</span><h1>${t}</h1><p class="mu">${x}</p><p class="mu sm">Próxima implementación. Aún no está disponible.</p></div>`;
V.inicio=()=>{const L=Object.values(S.own),cnt=L.reduce((a,c)=>a+c.cnt,0),best=L.length?RAR[Math.max(...L.map(c=>rar(c.n)))][0]:"—",
 dist=RAR.map((r,i)=>[r,L.filter(c=>rar(c.n)===i).length]),mx=Math.max(1,...dist.map(d=>d[1])),rec=L.slice().sort((a,b)=>b.ts-a.ts).slice(0,5);
 return `<div class="hero"><h1>Bienvenido, ${esc(S.name)}</h1><p class="mu">Colecciona artículos reales de Wikipedia. Cada sobre trae 5 cartas.</p><div class="btns"><a class="btn gold" href="#sobres">Abrir sobres</a><a class="btn" href="#coleccion">Mi colección</a><a class="btn" href="#enciclopedia">Explorar enciclopedia</a></div></div>
<div class="stats">${st("🎴",S.p+" / "+MAX,"Sobres")}${st("🗂️",L.length,"Cartas distintas")}${st("📦",cnt,"Cartas totales")}${st("⭐",best,"Mejor rareza")}</div>
<h2>Rarezas obtenidas</h2><div class="dist">${dist.map(d=>`<div><span>${d[0][0]}</span><i style="width:${d[1]/mx*100}%;background:${d[0][1]}"></i><b>${d[1]}</b></div>`).join("")}</div>
<h2>Últimas cartas</h2>${rec.length?`<div class="grid">${rec.map(c=>cardH(c)).join("")}</div>`:`<p class="mu">Aún no tienes cartas.</p>`}`};
const tabs=r=>`<div class="seg">${SUB[r].map(([k,l])=>`<button data-a="tab" data-k="${k}"${TAB[r]===k?' class="on"':""}>${l}</button>`).join("")}</div>`;
JG.sobres=()=>{const L=Object.values(S.own),best=L.length?RAR[Math.max(...L.map(c=>rar(c.n)))][0]:"—";
 return `<div class="packv"><div class="stack">🎴</div><div class="count"><span id="n">0</span><small> / ${MAX}</small></div><p class="mu">sobres disponibles · 5 cartas por sobre · ${LANGS[S.lang]}</p><div class="bar"><i id="bf"></i></div><p class="mu" id="nx"></p><div class="btns"><button class="btn gold big" data-a="open" data-n="1" id="open">Abrir</button><button class="btn big" data-a="open" data-n="10" id="open10">Abrir 10</button><button class="btn big" data-a="open" data-n="0" id="openall">Abrir todo (<span id="na">0</span>)</button></div><p class="mu sm">La rareza depende de en cuántos idiomas existe el artículo en Wikipedia. Abrir muchos sobres hace varias consultas a Wikipedia a la vez.</p></div><div class="stats">${st("🗂️",L.length,"Cartas distintas")}${st("📦",L.reduce((a,c)=>a+c.cnt,0),"Cartas totales")}${st("⭐",best,"Mejor rareza")}</div>`};
const F={q:"",cat:"",rar:"",lang:"",st:"all",so:"r",lim:60};
const opt=(a,cur)=>a.map(([k,v])=>`<option value="${k}"${cur===k?" selected":""}>${v}</option>`).join("");
CO.cartas=()=>`<h1>Colección</h1><div class="tools"><input id="fq" placeholder="Buscar en tu colección…" value="${esc(F.q)}"><select id="fc">${opt([["","Categoría"],...CL.map(c=>[c,c])],F.cat)}</select><select id="fr">${opt([["","Rareza"],...RAR.map((r,i)=>[""+i,r[0]])],F.rar)}</select><select id="fl">${opt([["","Idioma"],...Object.entries(LANGS)],F.lang)}</select><select id="fs">${opt([["all","Todas"],["own","Obtenidas"],["pend","Pendientes (sin obtener)"]],F.st)}</select><select id="fo">${opt([["r","Orden: rareza"],["y","Orden: año"],["a","Orden: nombre"],["d","Orden: recientes"]],F.so)}</select></div><p class="mu sm" id="fp"></p><div class="grid" id="cg"></div><div class="c"><button class="btn" data-a="more" id="fm">Mostrar más</button></div>`;
AC.cartas=()=>{[["fq","q"],["fc","cat"],["fr","rar"],["fl","lang"],["fs","st"],["fo","so"]].forEach(([i,k])=>$(i).oninput=e=>{F[k]=e.target.value;F.lim=60;cgrid()});cgrid()};
function cgrid(){let own=Object.values(S.own),pe=Object.values(S.seen);const q=F.q.toLowerCase();
 own=own.filter(c=>(!q||Object.values(c.v).some(v=>(v.t+" "+v.x).toLowerCase().includes(q)))&&(!F.cat||c.cat===F.cat)&&(F.rar===""||rar(c.n)===+F.rar)&&(!F.lang||c.v[F.lang]));
 pe=pe.filter(s=>!F.cat&&F.rar===""&&(!q||s.t.toLowerCase().includes(q))&&(!F.lang||s.L===F.lang));
 if(F.st==="own")pe=[];if(F.st==="pend")own=[];
 const nm=c=>ver(c,F.lang||S.lang)[1].t;
 own.sort(F.so==="y"?(a,b)=>(a.y==null)-(b.y==null)||a.y-b.y:F.so==="a"?(a,b)=>nm(a).localeCompare(nm(b),S.lang):F.so==="d"?(a,b)=>b.ts-a.ts:(a,b)=>rar(b.n)-rar(a.n)||b.n-a.n);
 const tot=own.length+pe.length,all=[...own.map(c=>cardH(c,{l:F.lang})),...pe.map(lockH)];
 $("fp").textContent=Object.keys(S.own).length+" obtenidas · "+Object.keys(S.seen).length+" pendientes · mostrando "+Math.min(F.lim,tot)+" de "+tot;
 $("cg").innerHTML=tot?all.slice(0,F.lim).join(""):'<p class="mu">No hay cartas con estos filtros.</p>';
 $("fm").style.display=tot>F.lim?"inline-block":"none"}
const E={q:"",items:[],cont:null,busy:false,L:"es"};
CO.enciclopedia=()=>`<h1>Enciclopedia</h1><p class="mu">Búsqueda en vivo en Wikipedia (${LANGS[S.lang]}) con la API oficial. No es un catálogo descargado: se consulta cada vez. Marca artículos como pendientes para verlos en tu colección hasta que los obtengas en un sobre.</p><div class="tools"><input id="eq" placeholder="Buscar artículos…" value="${esc(E.q)}"><button class="btn gold" data-a="esrch">Buscar</button></div><p class="err" id="ee"></p><div id="el"></div><div class="c"><button class="btn" data-a="emore" id="em" style="display:none">Cargar más</button></div>`;
AC.enciclopedia=()=>{if(E.L!==S.lang){E.items=[];E.cont=null;E.L=S.lang}$("eq").onkeydown=e=>{if(e.key==="Enter")esearch(true)};eList()};
const ee=m=>{const x=$("ee");if(x)x.textContent=m};
async function esearch(reset){if(E.busy)return;if(reset){E.q=$("eq").value.trim();E.items=[];E.cont=null}if(!E.q)return;E.busy=true;ee("Buscando…");
 try{const L=S.lang,j=await jf("https://"+L+".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(E.q)+"&gsrlimit=20&gsroffset="+(E.cont||0)+"&prop=pageprops|pageimages|extracts&ppprop=wikibase_item&piprop=thumbnail&pithumbsize=200&exintro=1&explaintext=1&exsentences=2&exlimit=max&format=json&origin=*");
  Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).forEach(p=>{const q=p.pageprops&&p.pageprops.wikibase_item;E.items.push({id:q||"p:"+L+":"+p.title,t:p.title,x:p.extract||"",i:p.thumbnail?p.thumbnail.source:"",u:"https://"+L+".wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_")),L})});
  E.cont=j.continue?j.continue.gsroffset:null;ee(E.items.length?"":"Sin resultados.");
 }catch(e){ee(errMsg(e))}
 E.busy=false;eList()}
function eList(){const el=$("el");if(!el)return;
 el.innerHTML=E.items.map((it,i)=>`<div class="row2"><div class="th">${it.i?img(it.i):"📖"}</div><div class="bd"><b>${esc(it.t)}</b> ${S.own[it.id]?'<span class="tag ok">Obtenida</span>':S.seen[it.id]?'<span class="tag">Pendiente</span>':""}<p>${esc(cut(it.x,220))}</p><a href="${esc(it.u)}" target="_blank" rel="noopener">Abrir en Wikipedia ↗</a> ${S.own[it.id]?"":`<button class="btn sm" data-a="pend" data-i="${i}">${S.seen[it.id]?"Quitar de pendientes":"☆ Marcar pendiente"}</button>`}</div></div>`).join("");
 $("em").style.display=E.cont&&!E.busy?"inline-block":"none"}
V.combate=()=>ph("⚔️","Combate","Duelos entre cartas con sus estadísticas.");
V.tienda=()=>ph("🛍️","Tienda","Sobres especiales y mejoras.");
JG.juegos=V.combate;JG.eventos=()=>ph("🎉","Eventos","Eventos y temporadas.");
V.jugar=()=>tabs("jugar")+JG[TAB.jugar]();
V.coleccion=()=>tabs("coleccion")+CO[TAB.coleccion]();
A.coleccion=()=>{const f=AC[TAB.coleccion];if(f)f()};
V.mercado=()=>tabs("mercado")+ph("🏪",{subastas:"Subastas",intercambios:"Intercambios",anuncios:"Mis anuncios"}[TAB.mercado],"Compra, venta e intercambio de cartas entre jugadores. Necesita servidor y cuentas.");
CO.perfil=()=>{const L=Object.values(S.own);return `<h1>Perfil</h1><div class="stats">${st("🗂️",L.length,"Cartas distintas")}${st("📦",L.reduce((a,c)=>a+c.cnt,0),"Cartas totales")}${st("☆",Object.keys(S.seen).length,"Pendientes")}</div><h2>Ajustes</h2><div class="tools"><input id="pn" value="${esc(S.name)}" maxlength="30" placeholder="Tu nombre"><select id="pl">${opt(Object.entries(LANGS),S.lang)}</select></div><p class="mu sm">El idioma elige qué versión de Wikipedia se usa para sobres, enciclopedia y cartas. La interfaz está solo en español.</p><h2>Copia de seguridad</h2><div class="tools"><button class="btn" data-a="test">Probar conexión</button><button class="btn" data-a="exp">Exportar JSON</button><button class="btn" data-a="imp">Importar JSON</button><button class="btn" data-a="rst" style="border-color:#a33">Borrar todo</button></div><p class="mu sm">El progreso se guarda solo en este navegador. Exporta una copia si quieres llevarlo a otro dispositivo.</p>`};
AC.perfil=()=>{$("pn").onchange=e=>{S.name=e.target.value.trim()||"Coleccionista";save()};$("pl").onchange=e=>setLang(e.target.value)};
/* ---------- Navegación y eventos ---------- */
function setLang(l){S.lang=l;save();$("lg").value=l;go()}
function go(){let h=location.hash.slice(1);
 if(OLD[h]){const[r,t]=OLD[h];if(t)TAB[r]=t;h=r;try{history.replaceState(null,"","#"+r)}catch(e){}}
 const k=NV.some(r=>r[0]===h)?h:"jugar";cur=k;
 $("nav").innerHTML=NV.map(r=>`<a href="#${r[0]}" class="${r[0]===k?"on ":""}${r[0]==="jugar"?"ctr":""}"><span>${r[1]}</span>${r[2]}${r[0]==="jugar"?`<b class="bd2" id="pb">${S.p}</b>`:""}</a>`).join("")+`<button data-a="social"><span>👥</span>Social</button>`;
 $("app").innerHTML=V[k]();if(A[k])A[k]();ui();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="det")det(b.dataset.id);else if(a==="open")openPack(+b.dataset.n);
 else if(a==="tab"){TAB[cur]=b.dataset.k;go()}else if(a==="social")social();
 else if(a==="soon")toast(b.dataset.t+": próxima implementación (necesita servidor y cuentas).");
 else if(a==="avatar"){TAB.coleccion="perfil";if(location.hash==="#coleccion")go();else location.hash="#coleccion"}
 else if(a==="more"){F.lim+=60;cgrid()}else if(a==="esrch")esearch(true);else if(a==="emore")esearch(false);
 else if(a==="pend"){const it=E.items[+b.dataset.i];if(S.seen[it.id])delete S.seen[it.id];else S.seen[it.id]={id:it.id,t:it.t,L:it.L,i:it.i,u:it.u};save();eList()}
 else if(a==="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));l.download="wikicartas-backup.json";l.click()}
 else if(a==="test"){const t0=Date.now();fetch("https://"+S.lang+".wikipedia.org/w/api.php?action=query&meta=siteinfo&format=json&origin=*").then(r=>toast("Wikipedia respondió HTTP "+r.status+" en "+(Date.now()-t0)+" ms")).catch(e=>toast("Sin respuesta de Wikipedia: "+e.message))}
 else if(a==="imp")$("pf").click();
 else if(a==="rst"){if(confirm("¿Borrar toda tu colección y progreso? Exporta una copia antes.")){S={ver:2,p:MAX,t:Date.now(),own:{},seen:{},lang:S.lang,name:"Coleccionista"};save();go()}}});
$("pf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.own)throw 0;
 for(const id in j.own){const o=S.own[id],n=j.own[id];if(!o)S.own[id]=n;else{o.cnt=Math.max(o.cnt,n.cnt);o.v=Object.assign({},n.v,o.v)}}
 Object.assign(S.seen,j.seen||{});for(const id in S.own)delete S.seen[id];save();toast("Copia importada");go()}catch(_){toast("Archivo no válido")}};r.readAsText(f);e.target.value=""};
$("all").onclick=()=>document.querySelectorAll("#row .flip").forEach(f=>f.classList.add("open"));
$("cl").onclick=()=>{$("ov").classList.remove("show");go()};
$("mc").onclick=()=>$("md").classList.remove("show");
$("md").onclick=e=>{if(e.target===$("md"))$("md").classList.remove("show")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("md").classList.remove("show")});
$("lg").innerHTML=opt(Object.entries(LANGS),S.lang);$("lg").onchange=e=>setLang(e.target.value);
addEventListener("hashchange",go);go();setInterval(ui,1000);
</script>
</body>
