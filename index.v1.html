<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiCartas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--sf:#fff;--tx:#1d1b18;--mu:#6b655c;--bd:#ddd6c8;--ac:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--sf:#1e2028;--tx:#f1efe9;--mu:#9a9aa6;--bd:#34363f;--ac:#7c93ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
header{padding:16px;text-align:center}
h1{margin:0;font-size:28px}
.sub{color:var(--mu);font-size:14px;font-family:system-ui,sans-serif}
nav{display:flex;justify-content:center;gap:8px;padding:0 16px 12px}
button{font:inherit;font-family:system-ui,sans-serif;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 16px;border-radius:10px}
button.on,button.big{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.pack{text-align:center;padding:20px 0}
.stack{font-size:84px;line-height:1}
.count{font-size:34px;font-weight:bold}
.bar{height:8px;background:var(--bd);border-radius:6px;max-width:320px;margin:10px auto;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.big{font-size:18px;padding:14px 32px;border-radius:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--sf);border:3px solid var(--rc);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 14px -4px var(--rc);position:relative;height:100%;min-height:300px}
.card .art{height:130px;background:linear-gradient(135deg,var(--rc),var(--bg));display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .hd{padding:8px 10px 0}
.card .nm{font-weight:bold;font-size:15px;color:var(--tx);text-decoration:none;display:block}
.card .yr{font-size:11px;color:var(--mu);font-family:system-ui,sans-serif}
.card .ds{padding:4px 10px;font-size:12px;line-height:1.35;color:var(--mu);flex:1;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card .rr{padding:5px 10px;font:bold 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;background:var(--rc);color:#fff;display:flex;justify-content:space-between}
.card.god{animation:glow 2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 26px 2px var(--rc)}}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 14px;font-family:system-ui,sans-serif;font-size:14px}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:9;overflow:auto;color:#fff;font-family:system-ui,sans-serif}
#ov.show{display:flex}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.flip{width:180px;height:310px;perspective:800px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden}
.flip .b{background:linear-gradient(135deg,#3b5bdb,#9c36b5);border-radius:14px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:56px}
.flip .f{transform:rotateY(180deg)}
.new{position:absolute;top:6px;right:6px;background:#e03131;color:#fff;font:bold 10px system-ui;padding:2px 6px;border-radius:6px;z-index:2}
.hide{display:none}
footer{text-align:center;color:var(--mu);font:12px system-ui,sans-serif;padding:0 16px 24px}
footer a{color:var(--ac)}
</style>
</head>
<body>
<header><h1>📖 WikiCartas</h1><div class="sub">Cada carta es un artículo real de Wikipedia</div></header>
<nav><button id="t1" class="on">Sobres</button><button id="t2">Colección</button></nav>
<main>
<section id="v1" class="pack">
<div class="stack">🎴</div>
<div class="count"><span id="n">0</span> / 50</div>
<div class="sub">sobres disponibles · 5 cartas por sobre</div>
<div class="bar"><i id="bf"></i></div>
<div class="sub" id="nx"></div>
<button class="big" id="open">Abrir sobre</button>
<div class="sub" id="err" style="color:#e03131;margin-top:10px"></div>
</section>
<section id="v2" class="hide">
<div class="tools"><b id="prog"></b>
<label>Orden: <select id="so"><option value="r">Rareza</option><option value="y">Año</option><option value="a">Nombre A–Z</option><option value="d">Más recientes</option></select></label></div>
<div class="grid" id="grid"></div>
</section>
</main>
<div id="ov"><div id="ld">Abriendo sobre…</div><div class="row" id="row"></div><div class="row"><button id="all">Revelar todas</button><button class="big" id="cl" style="margin:0">Cerrar</button></div></div>
<footer>Contenido de <a href="https://es.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> y <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, bajo licencia <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Cada carta enlaza a su artículo original.</footer>
<script>
const LANG="es"; // cambia a "en", "ca"… para otra Wikipedia
const API="https://"+LANG+".wikipedia.org/api/rest_v1";
const R=[["Común","#868e96"],["Rara","#2f9e44"],["Super rara","#1c7ed6"],["Ultra rara","#7048e8"],["Mítica","#d6336c"],["Legendaria","#f08c00"],["God","#e03131"]];
// La calidad depende de en cuántos idiomas existe el artículo (enlaces de Wikidata)
const TH=[8,20,45,80,130,200];
const YP=["P571","P569","P577","P575","P580","P585","P574","P1319"];
const KEY="wikicartas_live_v1",MAX=50,MS=300000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||typeof S.p!=="number")S={p:MAX,t:Date.now(),own:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function tick(){
 const now=Date.now();
 if(S.p>=MAX){S.p=MAX;S.t=now}
 else{const g=Math.floor((now-S.t)/MS);if(g>0){S.p=Math.min(MAX,S.p+g);S.t=S.p>=MAX?now:S.t+g*MS}}
}
function rar(n){let r=0;while(r<6&&n>=TH[r])r++;return r}
function fy(y){
 if(y==null)return "Año desconocido";
 if(y<=-1e6){const a=-y;return "Hace "+(a>=1e9?(a/1e9).toFixed(1).replace(".",",")+" mil millones":Math.round(a/1e6)+" millones")+" de años"}
 return y<0?(-y)+" a. C.":y+" d. C."}
let topPool=null;
async function loadTop(){
 if(topPool)return topPool;
 try{
  const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);
  const m=String(d.getMonth()+1).padStart(2,"0");
  const r=await fetch("https://wikimedia.org/api/rest_v1/metrics/pageviews/top/"+LANG+".wikipedia/all-access/"+d.getFullYear()+"/"+m+"/all-days");
  const j=await r.json();
  topPool=j.items[0].articles.map(a=>a.article).filter(t=>t.indexOf(":")<0&&t!=="Portada"&&t!=="Wikipedia").slice(0,1000);
 }catch(e){topPool=[]}
 return topPool}
async function wd(q){
 if(!q)return{y:null,n:1};
 const r=await fetch("https://www.wikidata.org/w/api.php?action=wbgetentities&ids="+q+"&props=claims|sitelinks&format=json&origin=*");
 const e=(await r.json()).entities[q];
 const n=Object.keys(e.sitelinks||{}).length;
 let y=null;
 for(const p of YP){
  try{
   const t=e.claims[p][0].mainsnak.datavalue.value.time;
   const m=/^([+-])(\d+)/.exec(t);
   if(m){const v=(m[1]==="-"?-1:1)*parseInt(m[2],10);if(v!==0){y=v;break}}
  }catch(_){}
 }
 return{y:y,n:n}}
async function draw(){
 const pool=await loadTop();
 for(let k=0;k<8;k++){
  try{
   const top=pool.length&&Math.random()<.35;
   const path=top?"/page/summary/"+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)]):"/page/random/summary";
   const r=await fetch(API+path);
   if(!r.ok)continue;
   const s=await r.json();
   if(s.type!=="standard"||!s.extract)continue;
   const w=await wd(s.wikibase_item);
   return{t:s.title,d:s.description||"",x:s.extract,i:(s.thumbnail&&s.thumbnail.source)||"",y:w.y,n:w.n,u:s.content_urls.desktop.page}
  }catch(e){}
 }
 throw new Error("No se pudo obtener la carta")}
function card(c,extra){
 const r=rar(c.n),rc=R[r];
 const ds=c.x.length>230?c.x.slice(0,227)+"…":c.x;
 return '<div class="card'+(r===6?" god":"")+'" style="--rc:'+rc[1]+'">'+(extra||"")+
 '<div class="art">'+(c.i?'<img src="'+esc(c.i)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':"📖")+'</div>'+
 '<div class="hd"><a class="nm" href="'+esc(c.u)+'" target="_blank" rel="noopener">'+esc(c.t)+'</a><span class="yr">'+fy(c.y)+(c.d?" · "+esc(c.d):"")+'</span></div>'+
 '<div class="ds">'+esc(ds)+'</div>'+
 '<div class="rr"><span>'+rc[0]+'</span><span>🌐 '+c.n+'</span></div></div>'}
function ui(){
 tick();save();
 $("n").textContent=S.p;$("bf").style.width=(S.p/MAX*100)+"%";
 if(!busy)$("open").disabled=S.p<1;
 if(S.p>=MAX)$("nx").textContent="¡Sobres al máximo!";
 else{const s=Math.max(0,Math.ceil((S.t+MS-Date.now())/1000));$("nx").textContent="Próximo sobre en "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
}
function grid(){
 const list=Object.values(S.own),so=$("so").value;
 $("prog").textContent="Cartas distintas: "+list.length;
 if(so==="r")list.sort((a,b)=>rar(b.n)-rar(a.n)||b.n-a.n);
 if(so==="y")list.sort((a,b)=>(a.y==null)-(b.y==null)||a.y-b.y);
 if(so==="a")list.sort((a,b)=>a.t.localeCompare(b.t,LANG));
 if(so==="d")list.sort((a,b)=>b.ts-a.ts);
 $("grid").innerHTML=list.length?list.map(c=>card(c,c.c>1?'<span class="new" style="background:var(--ac)">x'+c.c+'</span>':"")).join(""):'<div class="sub">Aún no tienes cartas. ¡Abre un sobre!</div>'}
function tab(n){
 $("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);
 $("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);
 if(n===2)grid()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);$("so").onchange=grid;
let busy=false;
$("open").onclick=async()=>{
 tick();if(S.p<1||busy)return;
 busy=true;$("open").disabled=true;$("err").textContent="";
 $("row").innerHTML="";$("ld").style.display="block";$("ov").classList.add("show");
 try{
  const cards=await Promise.all([0,1,2,3,4].map(draw));
  if(S.p>=MAX)S.t=Date.now();
  S.p--;
  const html=cards.map(c=>{
   const old=S.own[c.t];const isNew=!old;
   S.own[c.t]=Object.assign({},c,{c:(old?old.c:0)+1,ts:Date.now()});
   return '<div class="flip"><div><div class="b">🎴</div><div class="f">'+card(c,isNew?'<span class="new">NUEVA</span>':"")+'</div></div></div>'}).join("");
  save();
  $("ld").style.display="none";
  $("row").innerHTML=html;
  document.querySelectorAll(".flip").forEach(f=>f.onclick=()=>f.classList.add("open"));
 }catch(e){
  $("ov").classList.remove("show");
  $("err").textContent="No se pudo conectar con Wikipedia. No se ha gastado ningún sobre; inténtalo de nuevo.";
 }
 busy=false;ui()};
$("all").onclick=()=>document.querySelectorAll(".flip").forEach(f=>f.classList.add("open"));
$("cl").onclick=()=>{$("ov").classList.remove("show");grid()};
ui();setInterval(ui,1000);
</script>
</body>
</html>
